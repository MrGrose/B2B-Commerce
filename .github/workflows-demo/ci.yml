name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: b2b_commerce
          POSTGRES_PASSWORD: b2b_commerce
          POSTGRES_DB: b2b_commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U b2b_commerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Create test databases
        env:
          PGPASSWORD: b2b_commerce
        run: |
          for db in b2b_commerce_test b2b_commerce_migtest; do
            psql -h 127.0.0.1 -U b2b_commerce -d postgres -tc \
              "SELECT 1 FROM pg_database WHERE datname='${db}'" | grep -q 1 \
              || psql -h 127.0.0.1 -U b2b_commerce -d postgres -c "CREATE DATABASE \"${db}\""
          done

      - name: Lint
        run: uv run ruff check src tests

      - name: Test
        run: uv run pytest
        env:
          PYTHONPATH: src
          DATABASE_URL: postgresql+asyncpg://b2b_commerce:b2b_commerce@127.0.0.1:5432/b2b_commerce
          TEST_DATABASE_URL: postgresql+asyncpg://b2b_commerce:b2b_commerce@127.0.0.1:5432/b2b_commerce_test
          MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://b2b_commerce:b2b_commerce@127.0.0.1:5432/b2b_commerce_migtest
          REDIS_URL: redis://127.0.0.1:6379/0

      - name: Alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://b2b_commerce:b2b_commerce@127.0.0.1:5432/b2b_commerce_migtest
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: b2b-commerce:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
