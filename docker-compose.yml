services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: b2b_commerce
      POSTGRES_PASSWORD: b2b_commerce
      POSTGRES_DB: b2b_commerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b2b_commerce"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    restart: unless-stopped

  s3:
    image: localstack/localstack:3
    environment:
      SERVICES: s3
      DEBUG: "0"
    ports:
      - "4566:4566"
    volumes:
      - s3data:/var/lib/localstack
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    env_file: .env
    command: uvicorn b2b_commerce.main:app --host 0.0.0.0 --port 8000 --reload --app-dir src
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://b2b_commerce:b2b_commerce@postgres:5432/b2b_commerce
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: s3:4566
      MINIO_SECURE: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      s3:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    command: arq b2b_commerce.worker.WorkerSettings
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://b2b_commerce:b2b_commerce@postgres:5432/b2b_commerce
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: s3:4566
      MINIO_SECURE: "false"
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'arq.*WorkerSettings' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  s3data:
